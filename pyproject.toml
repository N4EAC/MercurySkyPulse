[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-skypulse"
version = "0.1.0"
description = "Cross-platform GUI shell for MercurySkyPulse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "PySide6>=6.8,<7",
]

[project.scripts]
mercury-skypulse = "presentation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*", "application_protocol*", "persistence*", "presentation*", "platform_runtime*", "transport*"]
