[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-skypulse"
version = "0.1.3"
description = "Cross-platform GUI shell for Mercury SkyPulse"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "av>=18,<19",
    "PySide6>=6.8,<7",
]

[project.scripts]
mercury-skypulse = "presentation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*", "application_protocol*", "persistence*", "presentation*", "platform_runtime*", "transport*"]

[tool.setuptools.package-data]
presentation = ["resources/*.png"]
